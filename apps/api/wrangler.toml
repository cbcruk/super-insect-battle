name = "super-insect-battle-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# D1 데이터베이스 바인딩.
# 아래 database_id는 `wrangler d1 create super-insect-battle` 실행 후
# 출력되는 값으로 교체해야 한다. (로컬 개발은 id 없이도 동작)
[[d1_databases]]
binding = "DB"
database_name = "super-insect-battle"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
